{% extends 'base.html' %}
{% from 'bootstrap5/form.html' import render_form %}
{% block title %}Verification{% endblock %}
{% block content %}
    <br>
    <div class="card shadow border-0 p-4">
        <h2 class="text-center mb-4">Verify OTP</h2>
        {{ render_form(form) }}
        <p id="timer" class="mt-3">Resend OTP in <span id="countdown">30</span> seconds</p><br>
        <a id="resend-btn" class="btn btn-secondary btn-sm w-auto d-inline-block d-none" href="{{url_for('resend_otp')}}">Resend Code</a>
    </div>
<script>
    let seconds={{ remaining | tojson }};
    const timer=document.getElementById("timer")
    const countdown=document.getElementById("countdown")
    const button=document.getElementById("resend-btn")
    // Repeat every 1 second
    let mytimer = setInterval(start_timer,1000)
    // Start the timer
    function start_timer(){
        seconds=seconds-1;
        countdown.innerHTML=seconds;
        if(seconds<=0){
            //Stop the timer
            clearInterval(mytimer);
            // hide the text
            timer.style.display="none";
            // Show the button
            button.style.display="inline-block";
        }
    }
</script>

{% endblock %}
