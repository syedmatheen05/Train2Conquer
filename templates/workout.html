<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Train2Conquer | Workout</title>

    {{ bootstrap.load_css() }}

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style2.css') }}"
    >


    <style>

        /* =====================================================
           TRAIN2CONQUER WORKOUT SCREEN
        ===================================================== */

        :root{

            --t2c-bg: #08090C;

            --t2c-panel: #101217;

            --t2c-panel-2: #151820;

            --t2c-panel-3: #1B1E26;

            --t2c-border: rgba(255,255,255,.08);

            --t2c-border-hover: rgba(255,255,255,.14);

            --t2c-text: #F5F5F3;

            --t2c-muted: #8E929D;

            --t2c-muted-2: #666B76;

            --t2c-orange: #FF512F;

            --t2c-orange-light: #FF704D;

            --t2c-gold: #D7AA48;

            --t2c-green: #35C978;
        }


        *{
            box-sizing: border-box;
        }


        body{

            margin: 0;

            min-height: 100vh;

            background:

                radial-gradient(
                    circle at 10% 5%,
                    rgba(255,81,47,.09),
                    transparent 25%
                ),

                radial-gradient(
                    circle at 90% 90%,
                    rgba(215,170,72,.06),
                    transparent 25%
                ),

                var(--t2c-bg);

            color: var(--t2c-text);

            font-family:
                'Manrope',
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                'Segoe UI',
                sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           MAIN WORKOUT CONTAINER
        ===================================================== */

        .t2c-workout-page{

            width: min(900px, 100%);

            margin: 0 auto;

            padding: 35px 18px 60px;
        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .t2c-workout-top{

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }


        .t2c-day{

            display: flex;

            flex-direction: column;

            gap: 3px;
        }


        .t2c-day-label{

            color: var(--t2c-orange);

            font-size: 10px;

            font-weight: 800;

            letter-spacing: .15em;

            text-transform: uppercase;
        }


        .t2c-day-number{

            font-family: 'Anton', sans-serif;

            font-size: 28px;

            font-weight: 400;

            line-height: 1;

            text-transform: uppercase;
        }


        .t2c-workout-count{

            padding: 9px 14px;

            border-radius: 10px;

            background: var(--t2c-panel);

            border: 1px solid var(--t2c-border);

            color: var(--t2c-muted);

            font-size: 11px;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: .05em;
        }


        .t2c-workout-count span{

            color: var(--t2c-text);

            font-weight: 800;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .t2c-workout-card{

            overflow: hidden;

            background: var(--t2c-panel);

            border: 1px solid var(--t2c-border);

            border-radius: 22px;

            box-shadow:

                0 30px 80px rgba(0,0,0,.4);
        }


        /* =====================================================
           VIDEO
        ===================================================== */
        /* =====================================================
   RESPONSIVE VIDEO FRAME
===================================================== */

.t2c-video-wrapper {
    position: relative;

    width: 100%;

    /*
     * Always maintain a proper landscape frame.
     */
    aspect-ratio: 16 / 9;

    background: #050608;

    overflow: hidden;

    /*
     * Prevent the video from becoming
     * ridiculously tall on large screens.
     */
    max-height: min(70vh, 620px);

    display: flex;
    align-items: center;
    justify-content: center;
}


/*
 * IMPORTANT:
 * contain = NEVER crop the exercise video.
 */

#workout-video {
    display: block;

    width: 100%;
    height: 100%;

    max-width: 100%;
    max-height: 100%;

    /*
     * Keep the complete video visible.
     */
    object-fit: contain;

    object-position: center center;

    background: #050608;

    /*
     * Prevent mobile browser from
     * treating the video as a separate page.
     */
    -webkit-user-select: none;
    user-select: none;
}


/* =====================================================
   PAUSE BUTTON
===================================================== */

.t2c-pause-wrapper {
    display: flex;

    justify-content: center;
    align-items: center;

    width: 100%;

    padding: 14px 18px 18px;

    background: var(--t2c-panel);
}


#pause-exercise {
    width: min(220px, 100%);

    min-height: 48px;

    border: 1px solid var(--t2c-border);

    border-radius: 12px;

    background: var(--t2c-panel-2);

    color: var(--t2c-text);

    font-size: 12px;

    font-weight: 800;

    letter-spacing: .06em;

    text-transform: uppercase;

    cursor: pointer;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease;
}


#pause-exercise:hover {
    transform: translateY(-1px);

    background: var(--t2c-panel-3);

    border-color:
        var(--t2c-border-hover);
}


#pause-exercise:active {
    transform: scale(.98);
}


/*
 * When paused, make the resume state
 * visually obvious.
 */

#pause-exercise.is-paused {
    background:
        linear-gradient(
            135deg,
            var(--t2c-orange),
            var(--t2c-orange-light)
        );

    border-color: transparent;

    color: #170E0A;
}


/* =====================================================
   MOBILE VIDEO
===================================================== */

@media (max-width: 768px) {

    .t2c-video-wrapper {

        /*
         * Full available width.
         */
        width: 100%;

        aspect-ratio: 16 / 9;

        max-height: none;

        border-radius: 0;
    }


    #workout-video {

        width: 100%;
        height: 100%;

        object-fit: contain;
    }


    .t2c-pause-wrapper {

        padding:
            12px 14px 16px;
    }


    #pause-exercise {

        width: 100%;

        max-width: 320px;

        min-height: 50px;
    }
}


/* =====================================================
   SMALL PHONES
===================================================== */

@media (max-width: 480px) {

    .t2c-video-wrapper {

        aspect-ratio: 16 / 9;
    }


    #pause-exercise {

        min-height: 48px;

        font-size: 11px;
    }
}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 360px) {

    .t2c-video-wrapper {

        aspect-ratio: 16 / 9;
    }


    #pause-exercise {

        min-height: 46px;

        padding:
            10px 14px;
    }
}


        /* =====================================================
           EXERCISE INFORMATION
        ===================================================== */

        .t2c-exercise-info{

            padding: 28px 30px 25px;

            text-align: center;

            border-bottom: 1px solid var(--t2c-border);
        }


        .t2c-exercise-label{

            color: var(--t2c-gold);

            font-size: 10px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: .14em;

            margin-bottom: 8px;
        }


        #exercise-name{

            margin: 0 0 7px;

            font-family: 'Anton', sans-serif;

            font-size: clamp(
                1.8rem,
                5vw,
                2.6rem
            );

            font-weight: 400;

            line-height: 1.05;

            text-transform: uppercase;

            color: var(--t2c-text);
        }


        #reps{

            margin: 0;

            color: var(--t2c-orange);

            font-size: 15px;

            font-weight: 800;
        }


        /* =====================================================
           NAVIGATION
        ===================================================== */

        .t2c-navigation{

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-top: 17px;
        }


        .t2c-navigation form{

            flex: 1;

            display: flex;

            justify-content: flex-end;
        }


        .t2c-navigation .btn{

            min-height: 46px;

            min-width: 140px;

            padding: 10px 20px;

            border-radius: 11px;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: .04em;

            text-transform: uppercase;

            transition:

                transform .15s ease,

                box-shadow .15s ease,

                filter .15s ease;
        }


        /* Previous */

        #previous-button{

            background: var(--t2c-panel);

            border: 1px solid var(--t2c-border);

            color: var(--t2c-muted);
        }


        #previous-button:hover:not(:disabled){

            background: var(--t2c-panel-2);

            border-color: var(--t2c-border-hover);

            color: var(--t2c-text);

            transform: translateY(-1px);
        }


        #previous-button:disabled{

            opacity: .35;

            cursor: not-allowed;
        }


        /* Done */

        #next-button{

            border: none;

            background:

                linear-gradient(
                    135deg,
                    var(--t2c-orange),
                    var(--t2c-orange-light)
                );

            color: #170E0A;

            box-shadow:

                0 9px 24px rgba(255,81,47,.16);
        }


        #next-button:hover{

            filter: brightness(1.06);

            transform: translateY(-1px);

            box-shadow:

                0 13px 30px rgba(255,81,47,.22);
        }


        /* =====================================================
   REST SCREEN
===================================================== */

#rest-screen {
    width: 100%;
    margin-top: 20px;

    min-height: 390px;

    padding: 45px 25px;

    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    text-align: center;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(215,170,72,.08),
            transparent 55%
        ),
        var(--t2c-panel);

    border: 1px solid var(--t2c-border);

    border-radius: 20px;

    color: var(--t2c-text);

    box-shadow:
        0 20px 55px rgba(0,0,0,.3);
}


/* REST heading */

#rest-title {
    margin: 0 0 12px;

    font-family: 'Anton', sans-serif;

    font-size: 3rem;

    font-weight: 400;

    line-height: 1;

    letter-spacing: .03em;

    color: var(--t2c-gold);

    text-align: center;
}


/* Rest message */

#rest-message {
    width: 100%;

    margin: 0 auto 15px;

    color: var(--t2c-muted);

    font-size: 14px;

    line-height: 1.6;

    text-align: center;
}


/* Next exercise */

#next-exercise {
    width: 100%;

    max-width: 500px;

    margin: 0 auto 20px;

    color: var(--t2c-text);

    font-size: 14px;

    font-weight: 700;

    line-height: 1.5;

    text-align: center;
}


/* =====================================================
   REST TIMER
===================================================== */

#rest-timer {
    width: 100%;

    margin: 5px 0 25px !important;

    font-family: 'Anton', sans-serif;

    font-size: 4.5rem !important;

    font-weight: 400;

    line-height: 1;

    letter-spacing: .01em;

    color: var(--t2c-text);

    text-align: center;

    white-space: nowrap;
}


/* Skip button */

#skip-rest {
    min-width: 150px;

    min-height: 43px;

    padding: 10px 22px;

    border-radius: 10px;

    border: 1px solid var(--t2c-border);

    background: var(--t2c-panel-2);

    color: var(--t2c-muted);

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .04em;

    text-align: center;
}


#skip-rest:hover {
    color: var(--t2c-text);

    border-color: var(--t2c-border-hover);

    background: var(--t2c-panel-3);
}


/* =====================================================
   +20 SEC REST BUTTON
===================================================== */

.t2c-timer-controls {
    display: flex;

    justify-content: center;

    margin: 0 0 14px;
}


#add-rest-time {
    min-width: 120px;

    min-height: 40px;

    padding: 9px 20px;

    border-radius: 10px;

    border: 1px solid var(--t2c-border);

    background: transparent;

    color: var(--t2c-gold);

    font-family: inherit;

    font-size: 11px;

    font-weight: 800;

    text-transform: uppercase;

    letter-spacing: .04em;

    text-align: center;

    cursor: pointer;

    transition:
        transform .15s ease,
        background .15s ease,
        border-color .15s ease,
        color .15s ease;
}


#add-rest-time::before {
    content: "+ ";
}


#add-rest-time:hover {
    color: var(--t2c-text);

    border-color: var(--t2c-gold);

    background: rgba(215,170,72,.1);

    transform: translateY(-1px);
}


#add-rest-time:active {
    transform: scale(.97);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    #rest-screen {
        min-height: 350px;

        padding: 35px 18px;
    }

    #rest-title {
        font-size: 2.4rem;
    }

    #rest-message {
        font-size: 13px;
    }

    #next-exercise {
        font-size: 12px;
        max-width: 330px;
    }

    #rest-timer {
        font-size: 3.2rem !important;
        margin: 8px 0 25px !important;
    }

    #add-rest-time {
        min-width: 110px;
        min-height: 42px;
        font-size: 10px;
    }

}


/* =====================================================
   VERY SMALL PHONES
===================================================== */

@media (max-width: 380px) {

    #rest-screen {
        min-height: 320px;

        padding: 30px 15px;
    }

    #rest-title {
        font-size: 2.1rem;
    }

    #rest-timer {
        font-size: 2.8rem !important;
    }

}

        /* =====================================================
           REDUCED MOTION
        ===================================================== */

        @media(prefers-reduced-motion: reduce){

            .t2c-navigation .btn{

                transition: none;
            }

        }

    </style>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
</head>


<body>
    {% include "loader.html" %}

<div class="t2c-workout-page">


    <!-- =====================================================
         TOP INFORMATION
    ====================================================== -->

    <div class="t2c-workout-top">


        <div class="t2c-day">

            <span class="t2c-day-label">
                Current session
            </span>

            <span class="t2c-day-number">
                Day {{ day_number }}
            </span>

        </div>


        <div class="t2c-workout-count">

            Workout
            <span id="workout-number">1</span>

        </div>


    </div>



    <!-- =====================================================
         WORKOUT CARD
    ====================================================== -->



<div class="t2c-workout-card workout-card">

    <!-- =================================================
         VIDEO
    ================================================== -->

    <div class="t2c-video-wrapper">

        <video
            id="workout-video"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
            preload="metadata"
        >

            <source
                id="video-source"
                src=""
                type="video/mp4"
            >

        </video>

    </div>


    <!-- =================================================
         PAUSE BUTTON
         Only appears for timed exercises.
    ================================================== -->

    <div class="t2c-pause-wrapper">

        <button
            id="pause-exercise"
            type="button"
            class="d-none"
            aria-label="Pause workout"
        >
            Ⅱ PAUSE
        </button>

    </div>


    <!-- =================================================
         EXERCISE INFORMATION
    ================================================== -->

    <div class="t2c-exercise-info">

        <div class="t2c-exercise-label">
            Next movement
        </div>


        <h3 id="exercise-name"></h3>


        <h4 id="reps"></h4>

    </div>

</div>


    <!-- =====================================================
         PREVIOUS / DONE
    ====================================================== -->

    <div
        id="navigation-buttons"
        class="t2c-navigation"
    >


        <button
            id="previous-button"
            class="btn"
            disabled
        >
            ← Previous
        </button>


        <form
            id="completeWorkoutForm"
            method="POST"
            data-loader-message="Saving your workout..."
            action="{{ url_for(
                'complete_workout',
                day=day_number
            ) }}"
        >

            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <button
                id="next-button"
                type="button"
                class="btn"
            >
                Done →
            </button>

        </form>


    </div>



    <!-- =====================================================
         REST SCREEN
    ====================================================== -->

    <div
        id="rest-screen"
        class="d-none"
    >


        <h2 id="rest-title">
            REST
        </h2>


        <p id="rest-message">

            Take a short break before your
            next exercise.

        </p>


        <p id="next-exercise">
        </p>


        <div id="rest-timer">
        </div>


        <div class="t2c-timer-controls">
            <button
                id="add-rest-time"
                class="t2c-plus20"
                type="button"
                aria-label="Add 20 seconds to rest timer"
            >
                20 SEC
            </button>
        </div>

        <button
            id="skip-rest"
            type="button"
            class="btn"
        >
            Skip Rest
        </button>


    </div>


</div>



{{ bootstrap.load_js() }}


<script>

    const workouts =
        {{ workouts | tojson | safe }};

</script>


<script src="{{ url_for('static', filename='js/loader.js') }}"></script>
<script src="{{ url_for('static', filename='js/workout.js') }}"></script>
</body>

</html>
