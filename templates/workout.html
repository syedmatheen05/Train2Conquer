<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workout</title>
    <!-- Bootstrap -->
    {{ bootstrap.load_css() }}
    <link rel="stylesheet" href="{{url_for('static',filename='css/style.css')}}">
</head>

<body>
	<!-- VIDEO -->
	<div class="container workout-container">
		<!-- DAY --> <!-- WORKOUT NUMBER -->
		<div class="d-flex justify-content-between align-items-center mb-2 mt-0">
    		<h3 class="fw-bold mb-0">Day {{ day_number }}</h3>
    		<h5 class="mb-0">Workout <span id="workout-number">1</span>/{{ workouts|length }}</h5>
		</div>
		<!-- WORKOUT CARD -->
		<div class="card shadow-sm border-0 workout-card">
			<!-- VIDEO -->
			<div class="video-wrapper">
				<video id="workout-video" autoplay muted loop playsinline>
					<source id="video-source" src="" type="video/mp4">
				</video>
				</div>
				<!-- CARD BODY -->
				<div class="card-body text-center p-4">
					<h3 id="exercise-name" class="fw-bold mb-1"></h3>
					<h4 id="reps" class="fw-bold"></h4>
				</div>
			</div>
			<!-- PREVIOUS / NEXT -->
			<div  id="navigation-buttons"  class="d-flex justify-content-between align-items-center mt-3">
				<button id="previous-button"class="btn btn-outline-primary px-4" disabled>← Previous</button>
				<button id="next-button" class="btn btn-primary px-4">Done →</button>
			</div>
			<!-- REST SCREEN -->
			<div id="rest-screen" class="card shadow border-0 text-center p-5 mt-4 d-none">
				<h2 id="rest-title" class="fw-bold text-primary">REST</h2>
				<p id="rest-message" class="text-muted">Take a short break before your next exercise.</p>
                <p id="next-exercise" class="text-muted"></p>
				<div id="rest-timer" class="display-1 fw-bold my-4"></div>
				<button id="skip-rest" class="btn btn-outline-secondary d-inline-block w-auto">Skip Rest</button>
			</div>
		</div>
	</div>
	{{ bootstrap.load_js() }}
    <script>
function speak(text) {
    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(text);

    speech.rate = 0.9;
    speech.pitch = 1;
    speech.volume = 1;

    window.speechSynthesis.speak(speech);
}


function speakCountdown(number) {
    window.speechSynthesis.cancel();

    const speech = new SpeechSynthesisUtterance(
        number.toString()
    );

    speech.rate = 1.2;
    speech.pitch = 1;

    window.speechSynthesis.speak(speech);
}


/* ==========================
   WORKOUT DATA FROM FLASK
========================== */

const workouts = {{ workouts | tojson }};


/* ==========================
   VARIABLES
========================== */

let currentWorkout = 0;

let restTime = 30;
let restInterval;
let exerciseTime = 0;
let exerciseInterval;

const video = document.getElementById("workout-video");
const videoSource = document.getElementById("video-source");

const workoutNumber =
    document.getElementById("workout-number");

const restTitle =
    document.getElementById("rest-title");

const restMessage =
    document.getElementById("rest-message");


const exerciseName =
    document.getElementById("exercise-name");

const reps =
    document.getElementById("reps");

const previousButton =
    document.getElementById("previous-button");

const nextButton =
    document.getElementById("next-button");

const navigationButtons =
    document.getElementById("navigation-buttons");

const restScreen =
    document.getElementById("rest-screen");

const restTimer =
    document.getElementById("rest-timer");

const nextExercise =
    document.getElementById("next-exercise");

const skipRest =
    document.getElementById("skip-rest");


/* ==========================
   LOAD WORKOUT
========================== */

function startExerciseTimer() {

    clearInterval(exerciseInterval);

    const workout = workouts[currentWorkout];

    exerciseTime = Number(workout.seconds);

    // This is a rep-based exercise
    if (exerciseTime <= 0) {
        return;
    }

    // Show starting time
    reps.textContent = `${exerciseTime} SEC`;

    exerciseInterval = setInterval(function () {

        exerciseTime--;

        reps.textContent = `${exerciseTime} SEC`;

        // Countdown 3, 2, 1
        if (exerciseTime <= 3 && exerciseTime > 0) {
            speakCountdown(exerciseTime);
        }

        // Exercise finished
        if (exerciseTime <= 0) {

            clearInterval(exerciseInterval);

            reps.textContent = "DONE ✓";

            video.pause();

            // Automatically start rest
            setTimeout(function () {
                startRest();
            }, 500);
        }

    }, 1000);
}

function loadWorkout(index) {

    const workout = workouts[index];

    if (!workout) {
        return;
    }
    clearInterval(exerciseInterval);


    // --------------------------
    // Workout number
    // --------------------------

    workoutNumber.textContent = index + 1;


    // --------------------------
    // Exercise name
    // --------------------------

    exerciseName.textContent = workout.exercise;


    // --------------------------
    // Reps OR seconds
    // --------------------------

    if (Number(workout.seconds) > 0) {

        reps.textContent = `${workout.seconds} SEC`;
        video.play().catch(function (error) {
            console.log("Video autoplay blocked:", error);
        });
        startExerciseTimer();

    } else {

        reps.textContent = workout.reps;
        video.play().catch(function (error) {
            console.log("Video autoplay blocked:", error);
        });
    }


    // --------------------------
    // Video
    // --------------------------

    if (workout.video) {

        videoSource.src = workout.video;

        video.load();

        video.play().catch(function(error) {
            console.log(
                "Video autoplay blocked:",
                error
            );
        });

    } else {

        console.warn(
            "No video found for:",
            workout.exercise
        );
    }


    // --------------------------
    // Previous button
    // --------------------------

    if (index === 0) {

        previousButton.disabled = true;

    } else {

        previousButton.disabled = false;
    }


    // --------------------------
    // Next button
    // --------------------------

    if (index === workouts.length - 1) {

        nextButton.textContent =
            "Finish ✓";

    } else {

        nextButton.textContent =
            "Done →";
    }
}


/* ==========================
   START REST
========================== */

function startRest() {

    speak("Take a rest");


    // Hide workout
    document
        .querySelector(".workout-card")
        .classList.add("d-none");


    // Hide navigation
    navigationButtons
        .classList.add("d-none");


    // Show rest screen
    restScreen
        .classList.remove("d-none");


    // Get rest time
    restTime =
        Number(workouts[currentWorkout].rest);


    // Display rest time
    restTimer.textContent =
        `${restTime} seconds`;


    // --------------------------
    // Show next exercise
    // --------------------------

    if (
        currentWorkout + 1 <
        workouts.length
    ) {

        nextExercise.textContent =
            `Your next exercise is ${
                workouts[currentWorkout + 1].exercise
            }`;

    } else {

        nextExercise.textContent =
            "Your workout is almost complete!";
    }


    // Clear previous timer
    clearInterval(restInterval);


    // If no rest
    if (restTime <= 0) {

        finishRest();

        return;
    }


    // --------------------------
    // Timer
    // --------------------------

    restInterval = setInterval(function() {

        restTime--;

        restTimer.textContent =
            `${restTime} seconds`;


        // Tell user the next exercise
        if (
            restTime === 7 &&
            currentWorkout + 1 <
            workouts.length
        ) {

            speak(
                `Next exercise is ${
                    workouts[currentWorkout + 1].exercise
                }`
            );
        }


        // Countdown 3, 2, 1
        if (
            restTime <= 3 &&
            restTime > 0
        ) {

            speakCountdown(restTime);
        }


        // Rest finished
        if (restTime <= 0) {

            clearInterval(restInterval);

            finishRest();
        }

    }, 1000);
}


/* ==========================
   FINISH REST
========================== */

function finishRest() {

    clearInterval(restInterval);


    // Hide rest screen
    restScreen
        .classList.add("d-none");


    // Show workout
    document
        .querySelector(".workout-card")
        .classList.remove("d-none");


    // Show navigation
    navigationButtons
        .classList.remove("d-none");


    // Move to next exercise
    currentWorkout++;


    // Load next exercise
    loadWorkout(currentWorkout);


    // Speak exercise name
    setTimeout(function() {

        if (workouts[currentWorkout]) {

            speak(
                workouts[currentWorkout].exercise
            );
        }

    }, 500);
}


/* ==========================
   NEXT BUTTON
========================== */

nextButton.addEventListener(
    "click",
    function() {

        // Last exercise
        if (
            currentWorkout ===
            workouts.length - 1
        ) {

            alert(
                "Workout Complete! 🎉"
            );

            return;
        }


        // Stop video
        video.pause();


        // Start rest
        startRest();
    }
);


/* ==========================
   PREVIOUS BUTTON
========================== */

previousButton.addEventListener(
    "click",
    function() {

        if (currentWorkout > 0) {

            currentWorkout--;

            loadWorkout(currentWorkout);
        }
    }
);


/* ==========================
   SKIP REST
========================== */

skipRest.addEventListener(
    "click",
    function() {

        clearInterval(restInterval);

        finishRest();
    }
);


/* ==========================
   FIRST WORKOUT
========================== */

function startWorkoutCountdown() {

    let countdown = 10;

    // Show 0/12 before workout starts
    workoutNumber.textContent = "0";

    // Show GET READY screen
    document.querySelector(".workout-card")
        .classList.add("d-none");

    navigationButtons
        .classList.add("d-none");

    restScreen
        .classList.remove("d-none");

    // Change REST screen into GET READY screen
    restTitle.textContent = "GET READY";

    restMessage.textContent = "";

    // Get first exercise name
    const firstExercise =
        workouts[0].name || workouts[0].exercise;

    nextExercise.textContent =
        `Your first exercise is ${firstExercise}`;

    // Show 10 seconds
    restTimer.textContent =
        `${countdown} seconds`;

    speak("Get ready");

    const countdownInterval =
        setInterval(function () {

            countdown--;

            restTimer.textContent =
                `${countdown} seconds`;

            if (
                countdown <= 3 &&
                countdown > 0
            ) {
                speakCountdown(countdown);
            }

            if (countdown <= 0) {

                clearInterval(countdownInterval);

                // Hide GET READY screen
                restScreen.classList.add("d-none");

                // Show workout
                document.querySelector(".workout-card")
                    .classList.remove("d-none");

                // Show navigation
                navigationButtons
                    .classList.remove("d-none");

                // Now actual workout becomes 1/12
                currentWorkout = 0;

                loadWorkout(currentWorkout);

                speak(
                    workouts[currentWorkout].exercise
                );
            }

        }, 1000);
}
if (workouts.length > 0) {
    startWorkoutCountdown();
}
</script>
</body>
</html>
